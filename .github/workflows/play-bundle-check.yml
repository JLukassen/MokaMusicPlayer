name: Play Store bundle compilation check

on:
  push:
    branches: [play-store-launch]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-bundle-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and NDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;37.0.0" \
            --channel=3 "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Compile and test release App Bundle without signing secrets
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:bundleRelease --no-build-cache --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q 'base/manifest/AndroidManifest.xml'
          echo "::notice::Unsigned CI bundle compiled. This is NOT a Play upload artifact."
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moka-play-bundle-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
