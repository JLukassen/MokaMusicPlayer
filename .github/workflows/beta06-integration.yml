name: Beta 6 integrated device-test build

on:
  push:
    branches: [beta06-autoeq-samsung]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta06-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-37.2" "build-tools;37.0.0"             --channel=3 "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Run unit tests and build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-build-cache --stacktrace
      - name: Verify Beta 6 debug APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" |
            grep -E "package: name='com.mokamusic.player'.*versionCode='27'.*versionName='4.0.0-beta06'"
          cp "$APK" Moka-Music-Player-4.0.0-beta06-dev-debug.apk
          sha256sum Moka-Music-Player-4.0.0-beta06-dev-debug.apk > SHA256SUMS.txt
      - name: Upload development-only test build
        uses: actions/upload-artifact@v4
        with:
          name: moka-beta06-integration-debug
          path: |
            Moka-Music-Player-4.0.0-beta06-dev-debug.apk
            SHA256SUMS.txt

# No tag or GitHub release is created for the development branch.
